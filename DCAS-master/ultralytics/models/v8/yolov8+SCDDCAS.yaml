# Scene-guided DCAS for small object detection
# Adds an auxiliary scene branch and semantic modulation on top of YOLOv8+DCAS.

nc: 10  # number of detection classes
scene_guided: True
scene_dim: 256
scene_channels: [32, 64, 128, 256]
scene_fusion:
  - [7, 3]
  - [11, 3]
  - [15, 2]
  - [19, 1]
  - [22, 2]
  - [25, 3]

scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, DSPPF, [512]]  # 7

head:
  - [-1, 1, Conv, [512, 1, 1]]
  - [4, 1, Conv, [256, 3, 2]]  # 9
  - [[-1, 6, 8], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]  # 11

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [2, 1, Conv, [128, 3, 2]]  # 13
  - [[-1, 4, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]  # 15

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [0, 1, Conv, [64, 3, 2]]  # 17
  - [[-1, 2, 16], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]  # 19 (P2/4-small)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]  # 22 (P3/8-medium)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]  # 25 (P4/16-large)

  - [[19, 22, 25], 1, Detect, [nc]]
